# Guis sur un seul VPS (NOTE-CADRAGE.md §5) : base, web (tableau de bord + API), worker satellite (sat), Caddy.
# Variables dans .env (modèle : .env.example). Lancement : docker compose up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: guis
      POSTGRES_USER: guis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guis -d guis"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: guis-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://guis:${POSTGRES_PASSWORD}@db:5432/guis
      # Mise à jour de l'app (vides : pas de message) ; voir .env.example.
      GUIS_MIN_APP_BUILD: ${GUIS_MIN_APP_BUILD:-}
      GUIS_LATEST_APP_BUILD: ${GUIS_LATEST_APP_BUILD:-}
      GUIS_APK_URL: ${GUIS_APK_URL:-}
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

  sat:
    build:
      context: workers/sat
    image: guis-sat:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://guis:${POSTGRES_PASSWORD}@db:5432/guis
      SAT_DAILY_HOUR_UTC: "4"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started   # le web applique les migrations

  # Sauvegarde : pg_dump chaque nuit (vers 2 h UTC), 14 jours gardés dans le volume « backups ».
  # Copie hors du serveur : voir docs/DEPLOIEMENT.md.
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: guis
      PGDATABASE: guis
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: "14"
    volumes:
      - backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date -u +%s); next=$$(date -u -d "tomorrow 02:00" +%s)
          [ "$$(date -u +%H)" -lt 2 ] && next=$$(date -u -d "today 02:00" +%s)
          sleep $$((next - now))
          f=/backups/guis-$$(date -u +%Y-%m-%d).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "sauvegarde $$f"; else echo "sauvegarde en échec" >&2; fi
          find /backups -name 'guis-*.dump' -mtime +$$KEEP_DAYS -delete
        done
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GUIS_DOMAIN: ${GUIS_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db:
  photos:
  backups:
  caddy_data:
  caddy_config:
