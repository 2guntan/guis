# Guis sur un seul VPS (NOTE-CADRAGE.md §5) : base, web (tableau de bord + API), worker satellite, Caddy.
# Variables dans .env (modèle : .env.example). Lancement : docker compose up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: guis
      POSTGRES_USER: guis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guis -d guis"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: guis-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://guis:${POSTGRES_PASSWORD}@db:5432/guis
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GUIS_DOMAIN: ${GUIS_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db:
  photos:
  caddy_data:
  caddy_config:
