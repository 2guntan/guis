name: Deploy Guis to VPS

on:
  workflow_dispatch:
  repository_dispatch:
    types: [guis-deploy-vps]

permissions:
  contents: read

concurrency:
  group: guis-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment secrets
        env:
          GUIS_VPS_HOST: ${{ secrets.GUIS_VPS_HOST }}
          GUIS_VPS_SSH_PRIVATE_KEY: ${{ secrets.GUIS_VPS_SSH_PRIVATE_KEY }}
          GUIS_VPS_KNOWN_HOSTS: ${{ secrets.GUIS_VPS_KNOWN_HOSTS }}
        run: |
          test -n "$GUIS_VPS_HOST" || { echo 'GUIS_VPS_HOST is missing' >&2; exit 1; }
          test -n "$GUIS_VPS_SSH_PRIVATE_KEY" || { echo 'GUIS_VPS_SSH_PRIVATE_KEY is missing' >&2; exit 1; }
          test -n "$GUIS_VPS_KNOWN_HOSTS" || { echo 'GUIS_VPS_KNOWN_HOSTS is missing' >&2; exit 1; }
      - name: Back up and deploy main
        env:
          GUIS_VPS_HOST: ${{ secrets.GUIS_VPS_HOST }}
          GUIS_VPS_SSH_PRIVATE_KEY: ${{ secrets.GUIS_VPS_SSH_PRIVATE_KEY }}
          GUIS_VPS_KNOWN_HOSTS: ${{ secrets.GUIS_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/guis-deploy-key"
          hosts_file="$RUNNER_TEMP/guis-known-hosts"
          output_file="$RUNNER_TEMP/guis-deploy-output"
          trap 'rm -f "$key_file" "$hosts_file" "$output_file"' EXIT
          printf '%s\n' "$GUIS_VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$GUIS_VPS_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$key_file" "$hosts_file"
          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$hosts_file" \
            "deploy@$GUIS_VPS_HOST" 'bash -se' < deploy/cloud-update.sh | tee "$output_file"
          grep -qx DEPLOYMENT_COMPLETE "$output_file"
