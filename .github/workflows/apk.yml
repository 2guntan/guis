# Tests de l'app Android et construction de l'APK, publiée en artefact téléchargeable.
# Adresse du serveur : secret de dépôt GUIS_API_URL (Settings → Secrets and variables → Actions → Secrets).
# Un secret, pas une variable : le dépôt est public, et une variable s'afficherait en clair dans les journaux
# (l'adresse provisoire guis.<IP>.sslip.io contient l'IP du VPS). La variable du même nom reste lue en repli.
# Signature : secrets GUIS_KEYSTORE_BASE64, GUIS_KEYSTORE_PASSWORD, GUIS_KEY_ALIAS, GUIS_KEY_PASSWORD ;
# sans eux, l'APK est signée avec la clé de debug et publiée sous un nom « ESSAI-NE-PAS-DISTRIBUER » :
# elle ne pourrait pas être mise à jour par l'APK signée (désinstallation obligatoire, saisies non envoyées perdues).
name: apk
on:
  push:
    paths: ['apps/agent/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['apps/agent/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Clé de signature (si fournie)
        env:
          KEYSTORE: ${{ secrets.GUIS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GUIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GUIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GUIS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore/guis.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/keystore/guis.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore/signing.properties"
            echo "GUIS_SIGNING=$RUNNER_TEMP/keystore/signing.properties" >> "$GITHUB_ENV"
            echo "APK signée avec la clé de release."
          else
            echo "::warning::Pas de clé de release : APK d'essai signée avec la clé de debug, à ne pas distribuer aux agents."
            echo "GUIS_ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            echo "APK_SUFFIX=-ESSAI-NE-PAS-DISTRIBUER" >> "$GITHUB_ENV"
          fi
      - name: Construire l'APK
        env:
          API_URL: ${{ secrets.GUIS_API_URL || vars.GUIS_API_URL || 'https://guis.example.invalid' }}
        run: flutter build apk --release --dart-define=API_URL="$API_URL" --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: guis-apk-${{ github.run_number }}${{ env.APK_SUFFIX }}
          path: apps/agent/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
