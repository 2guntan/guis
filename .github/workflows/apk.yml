# Tests de l'app Android et construction de l'APK, publiée en artefact téléchargeable.
# Sur main, l'APK signée et branchée sur le vrai serveur est aussi publiée en GitHub Release « apk-<build> » :
# lien stable https://github.com/2guntan/guis/releases/latest/download/guis.apk (GUIS_APK_URL du serveur).
# Adresse du serveur : secret de dépôt GUIS_API_URL (Settings → Secrets and variables → Actions → Secrets).
# Un secret, pas une variable : le dépôt est public, et une variable s'afficherait en clair dans les journaux
# (l'adresse provisoire guis.<IP>.sslip.io contient l'IP du VPS). La variable du même nom reste lue en repli.
# Signature : secrets GUIS_KEYSTORE_BASE64, GUIS_KEYSTORE_PASSWORD, GUIS_KEY_ALIAS, GUIS_KEY_PASSWORD ;
# sans eux, l'APK est signée avec la clé de debug et publiée sous un nom « ESSAI-NE-PAS-DISTRIBUER » :
# elle ne pourrait pas être mise à jour par l'APK signée (désinstallation obligatoire, saisies non envoyées perdues).
name: apk
on:
  push:
    paths: ['apps/agent/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['apps/agent/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      publishable: ${{ steps.publishable.outputs.ok }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Clé de signature (si fournie)
        env:
          KEYSTORE: ${{ secrets.GUIS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GUIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GUIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GUIS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore/guis.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/keystore/guis.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore/signing.properties"
            echo "GUIS_SIGNING=$RUNNER_TEMP/keystore/signing.properties" >> "$GITHUB_ENV"
            echo "APK signée avec la clé de release."
          else
            echo "::warning::Pas de clé de release : APK d'essai signée avec la clé de debug, à ne pas distribuer aux agents."
            echo "GUIS_ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            echo "APK_SUFFIX=-ESSAI-NE-PAS-DISTRIBUER" >> "$GITHUB_ENV"
          fi
      - name: Construire l'APK
        env:
          API_URL: ${{ secrets.GUIS_API_URL || vars.GUIS_API_URL }}
        run: |
          # Sans adresse du serveur, l'APK ne joindrait rien : refusé pour main, marqué « essai » ailleurs.
          if [ -z "$API_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::error::GUIS_API_URL manquant (secret ou variable du dépôt) : APK de main non construite."
              exit 1
            fi
            echo "::warning::GUIS_API_URL manquant : APK d'essai qui ne joint aucun serveur."
            API_URL=https://guis.example.invalid
            echo "APK_SUFFIX=-ESSAI-NE-PAS-DISTRIBUER" >> "$GITHUB_ENV"
          fi
          flutter build apk --release --dart-define=API_URL="$API_URL" --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: guis-apk-${{ github.run_number }}${{ env.APK_SUFFIX }}
          path: apps/agent/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: APK distribuable ?
        id: publishable
        run: |
          # Seulement une APK signée avec la clé de release et branchée sur le vrai serveur.
          if [ -z "$APK_SUFFIX" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

  # Publication réservée à main, dans un job à part : seul lui peut écrire dans le dépôt (créer la release).
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: apk-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: guis-apk-${{ github.run_number }}
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mv app-release.apk guis.apk
          sha256sum guis.apk > guis.apk.sha256
          notes="APK Guis, build $BUILD (commit ${GITHUB_SHA::7}).

          Installer : télécharger guis.apk sur le téléphone de l'agent et l'ouvrir.
          Empreinte SHA-256 : $(cut -d' ' -f1 guis.apk.sha256)

          Sur le serveur : GUIS_LATEST_APP_BUILD=$BUILD pour proposer cette version aux agents."
          gh release create "apk-$BUILD" guis.apk guis.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "App agent — build $BUILD" --notes "$notes" --latest
